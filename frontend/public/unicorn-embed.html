<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual</title>
  <script src="/unicornStudio.umd.js"></script>
  <style>
    html, body, #app {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c1015;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      if (window.UnicornStudio) {
        window.UnicornStudio.addScene({
          elementId: 'app',
          filePath: '/scene.json',
          fps: 60,
          scale: 1,
          interactivity: {
            mouse: {
              disableMobile: true
            }
          }
        });
      }
    });
  </script>
</body>
</html>
